<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#111827">
	<title>Welcome to Victory</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			color: #fff;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: radial-gradient(ellipse at 50% 0%, #374151 0, #111827 55%, #080d18 100%);
		}
		main { max-width: 680px; text-align: center; }
		.mark {
			width: 76px;
			height: 76px;
			display: grid;
			place-items: center;
			margin: 0 auto 28px;
			border: 1px solid #f5c96a;
			border-radius: 50%;
			color: #f5c96a;
			font-size: 34px;
			box-shadow: 0 0 40px #f5c96a26;
		}
		p { margin: 0 0 12px; color: #f5c96a; font-size: .78rem; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
		h1 { margin: 0; font-size: clamp(2.8rem, 9vw, 5.5rem); line-height: 1.02; letter-spacing: -.06em; }
		.subtitle { max-width: 460px; margin: 22px auto 0; color: #cbd5e1; font-size: 1.08rem; line-height: 1.7; }
	</style>
</head>
<body>
	<main>
		<div class="mark" aria-hidden="true">✦</div>
		<p>A new chapter begins</p>
		<h1>Welcome to Victory</h1>
		<div class="subtitle">Every great achievement starts with a single step. We’re glad you’re here.</div>
	</main>
</body>
</html>
